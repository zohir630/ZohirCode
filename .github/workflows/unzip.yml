name: Unzip

on:
  push:
    branches: [main]
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into repo root
        run: |
          shopt -s nullglob
          for z in *.zip; do
            rm -rf /tmp/out && mkdir -p /tmp/out
            unzip -o -q "$z" -d /tmp/out
            # সব ফাইল একটা ফোল্ডারের ভেতরে থাকলে ভেতরে ঢুকে নেওয়া
            n=$(ls -A /tmp/out | wc -l)
            first=$(ls -A /tmp/out | head -n 1)
            if [ "$n" -eq 1 ] && [ -d "/tmp/out/$first" ]; then src="/tmp/out/$first"; else src=/tmp/out; fi
            cp -a "$src"/. .
            git rm -q -f "$z"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unzip files"
          git push
