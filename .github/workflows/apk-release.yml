name: Publish APK

on:
  push:
    branches: [main]
    paths: ["*.apk"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(*.apk)
          if [ ${#files[@]} -eq 0 ]; then echo "No APK found"; exit 0; fi
          tag="v1.${{ github.run_number }}"
          gh release create "$tag" "${files[@]}" --title "Zohirola $tag" --notes "New APK" --latest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q -f "${files[@]}"
          git commit -m "Move APK to release $tag"
          git push
